name: release

# An operator's tag starts this workflow. It builds the three binaries,
# release.json and checksums.txt into a draft release, and it stops there.
# It holds no signing key. The operator signs checksums.txt offline with
# `make release-sign`, uploads checksums.txt.minisig, and publishes the
# draft (KTD26, docs/operating.md).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Build the binaries and the checksum file
        run: make release-dist VERSION="$GITHUB_REF_NAME"
      - name: Create the unsigned draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes "Unsigned draft. Do not publish it until its checksum file is signed offline (docs/operating.md)."
          dist/"$GITHUB_REF_NAME"/*
