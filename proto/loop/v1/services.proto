syntax = "proto3";

package loop.v1;

import "loop/v1/envelope.proto";

option go_package = "github.com/iantanwx/loop/gen/loop/v1;loopv1";

// One service for each CLI noun, and one RPC for each server-side verb.
// Client-side verbs (escalation judge, install, upgrade, rollback, restore,
// serve, doctor) have no RPC. The client-side doctor calls doctor-github
// for the checks that need the server's GitHub credentials, and doctor-env
// for each .env in a checkout with no live run.

service WorkService {
  rpc Peek(VerbRequest) returns (Envelope);
  rpc Show(VerbRequest) returns (Envelope);
  rpc List(VerbRequest) returns (Envelope);
  rpc Edit(VerbRequest) returns (Envelope);
  rpc Note(VerbRequest) returns (Envelope);
  rpc Block(VerbRequest) returns (Envelope);
  rpc Unblock(VerbRequest) returns (Envelope);
  rpc Cancel(VerbRequest) returns (Envelope);
  rpc Create(VerbRequest) returns (Envelope);
  rpc Shape(VerbRequest) returns (Envelope);
  rpc Ask(VerbRequest) returns (Envelope);
  rpc Duplicate(VerbRequest) returns (Envelope);
  rpc Supersede(VerbRequest) returns (Envelope);
}

service RunService {
  rpc Finish(VerbRequest) returns (Envelope);
  rpc Show(VerbRequest) returns (Envelope);
  rpc List(VerbRequest) returns (Envelope);
  rpc Events(VerbRequest) returns (Envelope);
}

service ReviewService {
  rpc Submit(VerbRequest) returns (Envelope);
  rpc Threads(VerbRequest) returns (Envelope);
  rpc Rounds(VerbRequest) returns (Envelope);
  rpc Checklist(VerbRequest) returns (Envelope);
}

service QaService {
  rpc Report(VerbRequest) returns (Envelope);
}

service BranchService {
  rpc Push(VerbRequest) returns (Envelope);
  rpc Sync(VerbRequest) returns (Envelope);
}

service PrService {
  rpc Open(VerbRequest) returns (Envelope);
  rpc Show(VerbRequest) returns (Envelope);
  rpc Files(VerbRequest) returns (Envelope);
  rpc Diff(VerbRequest) returns (Envelope);
  rpc Threads(VerbRequest) returns (Envelope);
  rpc Reply(VerbRequest) returns (Envelope);
  rpc Checks(VerbRequest) returns (Envelope);
  rpc Logs(VerbRequest) returns (Envelope);
  rpc Rerun(VerbRequest) returns (Envelope);
  rpc Pending(VerbRequest) returns (Envelope);
}

service MergeService {
  rpc Status(VerbRequest) returns (Envelope);
}

service EscalationService {
  rpc Raise(VerbRequest) returns (Envelope);
  rpc Route(VerbRequest) returns (Envelope);
  rpc Decisions(VerbRequest) returns (Envelope);
}

service RetroService {
  rpc Record(VerbRequest) returns (Envelope);
  rpc Held(VerbRequest) returns (Envelope);
  rpc Route(VerbRequest) returns (Envelope);
  rpc Compared(VerbRequest) returns (Envelope);
}

service DecisionService {
  rpc File(VerbRequest) returns (Envelope);
  rpc List(VerbRequest) returns (Envelope);
  rpc Fire(VerbRequest) returns (Envelope);
  rpc Defer(VerbRequest) returns (Envelope);
  rpc Settle(VerbRequest) returns (Envelope);
  rpc Moot(VerbRequest) returns (Envelope);
}

service OverwatchService {
  rpc Sweep(VerbRequest) returns (Envelope);
}

service FaultService {
  rpc Report(VerbRequest) returns (Envelope);
  rpc Show(VerbRequest) returns (Envelope);
  rpc List(VerbRequest) returns (Envelope);
  rpc Ack(VerbRequest) returns (Envelope);
  rpc Resolve(VerbRequest) returns (Envelope);
}

service CoordinatorService {
  rpc Send(VerbRequest) returns (Envelope);
  rpc Restart(VerbRequest) returns (Envelope);
  rpc Upgrade(VerbRequest) returns (Envelope);
}

service InboxService {
  rpc List(VerbRequest) returns (Envelope);
  rpc Answer(VerbRequest) returns (Envelope);
  rpc Defer(VerbRequest) returns (Envelope);
  rpc Prepare(VerbRequest) returns (Envelope);
  rpc Wait(VerbRequest) returns (Envelope);
  rpc Note(VerbRequest) returns (Envelope);
}

service RoomService {
  rpc Open(VerbRequest) returns (Envelope);
  rpc Apply(VerbRequest) returns (Envelope);
  rpc Close(VerbRequest) returns (Envelope);
  rpc List(VerbRequest) returns (Envelope);
}

service PrdService {
  rpc Submit(VerbRequest) returns (Envelope);
}

service EpicService {
  rpc Create(VerbRequest) returns (Envelope);
  rpc Adr(VerbRequest) returns (Envelope);
  rpc SkipDesign(VerbRequest) returns (Envelope);
  rpc AcceptDifference(VerbRequest) returns (Envelope);
  rpc Decompose(VerbRequest) returns (Envelope);
}

service StageService {
  rpc Pause(VerbRequest) returns (Envelope);
  rpc Resume(VerbRequest) returns (Envelope);
  rpc List(VerbRequest) returns (Envelope);
}

service SettingsService {
  rpc Show(VerbRequest) returns (Envelope);
  rpc Set(VerbRequest) returns (Envelope);
}

service SecretService {
  rpc Check(VerbRequest) returns (Envelope);
  rpc Set(VerbRequest) returns (Envelope);
  rpc Import(VerbRequest) returns (Envelope);
}

service ProjectService {
  rpc Add(VerbRequest) returns (Envelope);
  rpc List(VerbRequest) returns (Envelope);
  rpc Show(VerbRequest) returns (Envelope);
  rpc Remove(VerbRequest) returns (Envelope);
  rpc Move(VerbRequest) returns (Envelope);
}

service HostService {
  rpc Drain(VerbRequest) returns (Envelope);
  rpc DoctorGithub(VerbRequest) returns (Envelope);
  rpc DoctorEnv(VerbRequest) returns (Envelope);
}

service MetaService {
  rpc Schema(VerbRequest) returns (Envelope);
  rpc Status(VerbRequest) returns (Envelope);
  rpc Version(VerbRequest) returns (Envelope);
}
