version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Every RPC carries one generic VerbRequest and returns one Envelope (KTD11).
    # The typed schema of each verb lives in the CLI registry, not in proto.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
